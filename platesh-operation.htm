<form class="yoomoney-payment-form" action="https://yookassa.ru/integration/simplepay/payment" method="post" accept-charset="utf-8" >

    <div class="ym-products">
    <div class="ym-block-title ym-products-title">Товары</div>

    <div class="ym-product">
            <div class="ym-product-line">
                <span class="ym-product-description"><span class="ym-product-count">1.0×</span>Гид Харизма</span>
                <span class="ym-product-price" data-price="99.0" data-id="652" data-count="1.0">99,00&nbsp;₽</span>
            </div>
            
        <input disabled="" type="hidden" name="text" value="Гид Харизма"><input disabled="" type="hidden" name="price" value="99.0"><input disabled="" type="hidden" name="quantity" value="1.0"><input disabled="" type="hidden" name="paymentSubjectType" value="commodity"><input disabled="" type="hidden" name="paymentMethodType" value="full_prepayment"><input disabled="" type="hidden" name="tax" value="1"></div></div>
    <input value="" type="hidden" name="ym_merchant_receipt">

    <div class="ym-customer-info">
        <div class="ym-block-title">О покупателе</div>
        <input name="cps_email" class="ym-input" placeholder="Email" type="text" value="">
        <input name="cps_phone" class="ym-input" placeholder="Телефон" type="text" value="">
        <input name="custName" class="ym-input" placeholder="ФИО" type="text" value="">
        
        
        <textarea class="ym-textarea ym-display-none" name="orderDetails" placeholder="Комментарий" value="После оплаты обязательно нажмите на кнопку ниже &quot;Вернуться на сайт&quot;, иначе вы свой PDF не получите. Если проблемы возникнут - обращайтесь в нашу техподдержку">После оплаты обязательно нажмите на кнопку ниже "Вернуться на сайт", иначе вы свой PDF не получите. Если проблемы возникнут - обращайтесь в нашу техподдержку</textarea>
    </div>

    <div class="ym-hidden-inputs">
       <input name="shopSuccessURL" type="hidden" value="https://harizma-guide.github.io/platesh-succesfull.htm">
       <input name="shopFailURL" type="hidden" value="https://harizma-guide.github.io/error.htm">
       
    </div>

    <input name="customerNumber" type="hidden" value="Покупка гида Харизма">
    
    <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
        <div class="ym-input-icon-rub ym-display-none">
            <input name="sum" placeholder="0.00" class="ym-input ym-sum-input ym-required-input" type="number" step="any" value="99">
        </div>
        <button data-text="Заплатить" class="ym-btn-pay ym-result-price"><span class="ym-text-crop">Заплатить</span> <span class="ym-price-output">99,00&nbsp;₽</span></button><img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.35.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
    </div>
<input name="shopId" type="hidden" value="1475662"></form>
